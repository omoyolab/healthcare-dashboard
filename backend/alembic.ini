[alembic]
script_location = migrations
prepend_sys_path = .
# Required from Alembic 1.20; without it path splitting is the legacy behaviour.
path_separator = os
# No sqlalchemy.url here: env.py takes it from app settings, so the database
# URL has exactly one source.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
