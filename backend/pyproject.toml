[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthcare-dashboard-api"
version = "0.1.0"
description = "Patient management API for a medical practice"
requires-python = ">=3.12"

# Lower bounds, not exact pins: the Docker image installs from a lock file so
# builds are reproducible, while local development stays easy to upgrade.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7",  # EmailStr needs the email-validator extra
  "pydantic-settings>=2.3",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx2>=2.13",  # what starlette's TestClient now expects
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting (no separate isort needed)
  "UP",       # pyupgrade - keep syntax current
  "B",        # bugbear - real bug patterns
  "ASYNC",    # async antipatterns, e.g. blocking calls in a coroutine
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Star-imports in migrations are Alembic's own template, and asserts are the
# point of a test file.
"migrations/*" = ["F403", "F405"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests get the same checks except the ones that only add noise to fixtures.
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: exercises a real database",
]
