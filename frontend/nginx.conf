server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames can be cached forever; index.html must never be, or users
  # keep loading an old bundle that points at assets which no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same-origin API: the browser never makes a cross-origin request, so CORS is
  # not load-bearing in the deployed stack.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: deep links like /patients/<id> are routed by the client.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
