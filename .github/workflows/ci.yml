name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare
        ports: ["5432:5432"]
        # Steps must not start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
      APP_ENV: test
      SEED_ON_STARTUP: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app migrations tests scripts
          ruff format --check app migrations tests scripts

      - name: Typecheck
        run: mypy app tests

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Migrations match the models
        run: alembic upgrade head && alembic check

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: |
          npx eslint . --max-warnings=0
          npx prettier --check src e2e

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build

  e2e:
    name: End to end (deployed stack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack exactly as a reviewer would
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            healthy=$(docker compose -f docker-compose.yml ps --format '{{.Service}} {{.Health}}' | grep -cE ' healthy$' || true)
            [ "$healthy" -ge 3 ] && exit 0
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Install browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests against nginx, not the dev server
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test --project=desktop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
